[project]
name = "isaac-exploration"
version = "0.1.0"
description = "Photogrammetry to Isaac Sim environment pipeline with automated validation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "trimesh>=4.4",
    "rtree>=1.3",
    "pillow>=10.0",
    "scipy>=1.13",
    "tifffile>=2026.10.15",
    "imagecodecs>=2026.10.10",
    "opencv-python-headless>=5.0.0.93",
    "requests>=2.34.2",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false
