camera:
  width: 832                             # Cosmos 3 480p tier, 16:9
  height: 480
  focal_length_mm: 14.0
  horizontal_aperture_mm: 20.955         # ~73.6 deg horizontal FOV
  clip: [0.5, 20000.0]
  fps: 30
  mount: fixed                           # fixed (hard-mounted, tilts with the body) | gimbal (yaw only)
  mount_pitch_deg: 30.0                  # look-down angle relative to the body x axis

rig:                                     # 4-fisheye rig (flight/rig_fisheye.py), all hard-mounted
  camera_hz: 30
  width: 640
  height: 480
  # OpenCV fisheye (= Kalibr/OpenVINS "equidistant"): r = f * theta_d, theta_d = theta (1 + k1 theta^2 + ...).
  # f = 160 px puts theta = 86 deg at the top/bottom edge (172 deg vertical) and 90 deg at r = 251 px.
  # The RTX renderer stops at theta = 90 deg, so each image is a 180 deg circle with black corners.
  fx: 160.0
  fy: 160.0
  k: [0.0, 0.0, 0.0, 0.0]
  depth: false                           # also render distance_to_camera per camera (slower)
  # An image shows the pose set 3 renderer updates earlier (flight/rig_fisheye.py --lag-test).
  # lockstep waits for 3 consecutive tile-idle updates, which covers that, so no extra settle.
  settle_updates: 0
  freerun_lag_frames: [1, 1, 0, 0]       # measured lag for 1, 2, 3, 4 updates per free-running frame
  cameras:                               # name: [yaw left of forward deg, pitch down deg]
    cam0_front: [0.0, 20.0]
    cam1_left: [90.0, 20.0]
    cam2_back: [180.0, 20.0]
    cam3_right: [-90.0, 20.0]

environments:                            # Isaac USD environments (flights with env:); Cesium flights use site/source
  rivermark:
    usd: /Isaac/Environments/Outdoor/Rivermark/rivermark.usd   # under the Isaac assets root
    colliders: false                     # true = Pegasus flies inside the stage; RTX then re-renders the whole town every
                                         # update (16 physics steps took minutes), so clearance is checked on AABBs instead
    settle_updates: 4                    # renderer updates per lockstep frame (image lags the pose by 3)
    warmup_updates: 30                   # per warm-up pose: lets RTX stream textures in before frame 0
    clip: [0.1, 5000.0]
    stereo: {baseline_m: 0.30, pitch_deg: 20.0}
    openvins: {fi_max_dist: 300.0}
    sky_dome: /World/main/Sky
    ground_z: 6.0                        # approx. ground height (PX4 flights take off from here)
    lighting:                            # docs/test_plans.md P7; "default" keeps the stage's own sky
      default: {}
      low_sun: {sky_hdr: /NVIDIA/Assets/Skies/Clear/venice_sunset_4k.hdr}
      overcast: {sky_hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr}

  nurec_wormhole:                        # NuRec Gaussian splats (docs/test_plans.md E2): NVIDIA "wormhole" hall, 37 x 24 m map
