# Temperate forest in rolling hills with a meandering valley; conifer stands with broadleaf edges,
# clearings and an open valley floor (flight corridor). ~800 x 800 m.
name: forest_valley
source: procedural
seed: 11
terrain:
  size_m: 800
  resolution_m: 2.0
  hills_m: 22                     # fBm amplitude
  hill_scale_m: 260
  octaves: 5
  valley: {depth_m: 14, width_m: 45, meander_m: 70, meander_wavelength_m: 420}
  material: /NVIDIA/Materials/Base/Natural/Grass_Countryside.mdl
  uv_tile_m: 3.0
masks:
  forest: {scale_m: 220, cover: 0.65}           # 65 % forested, the rest clearings
scatter:
  conifers:
    class: tree
    assets: [/NVIDIA/Assets/Vegetation/Trees/Douglas_Fir.usd, /NVIDIA/Assets/Vegetation/Trees/Norway_Spruce.usd,
             /NVIDIA/Assets/Vegetation/Trees/White_Pine.usd, /NVIDIA/Assets/Vegetation/Trees/Eastern_Hemlock.usd,
             /NVIDIA/Assets/Vegetation/Trees/Colorado_Spruce.usd]
    density_per_ha: 90
    scale_range: [1.5, 2.4]           # NVIDIA assets are young trees (~6-9 m); scale to 12-22 m stands
    slope_max_deg: 32
    height_range_m: [-6, 80]                    # keep the valley floor open
    mask: forest
    clear_radius_m: 25                          # take-off clearing at the origin
    sink_m: 0.2
  broadleaf:
    class: tree
    assets: [/NVIDIA/Assets/Vegetation/Trees/Red_Maple.usd, /NVIDIA/Assets/Vegetation/Trees/Sugar_Maple.usd,
             /NVIDIA/Assets/Vegetation/Trees/American_Beech.usd, /NVIDIA/Assets/Vegetation/Trees/Red_Oak.usd,
             /NVIDIA/Assets/Vegetation/Trees/Gray_Birch.usd]
    density_per_ha: 25
    scale_range: [1.3, 1.9]
    slope_max_deg: 25
    mask: forest
    clear_radius_m: 25
    sink_m: 0.2
  shrubs:
    class: shrub
    assets: [/NVIDIA/Assets/Vegetation/Shrub/Boxwood.usd, /NVIDIA/Assets/Vegetation/Shrub/Cedar_Shrub.usd,
             /NVIDIA/Assets/Vegetation/Shrub/Forsythia.usd]
    density_per_ha: 60
    scale_range: [0.7, 1.3]
    obstacle: false                             # below flight heights; not counted for clearance
  rocks:
    class: rock
    assets: [/NVIDIA/Assets/Vegetation/Rocks/rock_small_01.usda, /NVIDIA/Assets/Vegetation/Rocks/rock_small_05.usda,
             /NVIDIA/Assets/Vegetation/Rocks/rock_small_09.usda]
    density_per_ha: 8
    scale_range: [1.0, 3.0]
    sink_m: 0.3
    obstacle: false
sky:
  hdr: /NVIDIA/Assets/Skies/Cloudy/champagne_castle_1_4k.hdr
  intensity: 1000
  sun_intensity: 2500
  sun_elevation_deg: 40
  sun_azimuth_deg: 150
environment:                                    # merged into the config/flight.yaml block
  ground_z: 0.0
  stereo: {baseline_m: 0.30, pitch_deg: 20.0}
  openvins: {fi_max_dist: 300.0}
  lighting:
    default: {}
    overcast: {sky_hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr}
  sky_dome: /World/Sky/Dome
