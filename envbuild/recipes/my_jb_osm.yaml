# Street-level Johor Bahru city centre from OpenStreetMap (same origin as my_jb_city.yaml tiles):
# low and mid-rise shophouse blocks, malls, the station area, arterial roads.
name: my_jb_osm
source: osm
seed: 73
lat: 1.4600
lon: 103.7634
radius_m: 400
default_heights:
  apartments: [25, 60]
  residential: [12, 40]
  commercial: [10, 30]
  retail: [8, 18]
  office: [20, 70]
  hotel: [30, 80]
  house: [7, 10]
  yes: [7, 18]
style_by_type: {apartments: 0, residential: 2, office: 3, hotel: 3, commercial: 1, retail: 2, house: 4}
floor_m: 3.0
bay_m: 3.6
street_lights_m: 30                          # lamps along roads >= 8 m wide
shopfront_frac: 0.15                         # share of other blocks with a shop ground floor
roof_material: /NVIDIA/Materials/Base/Natural/Asphalt.mdl     # membrane / tar roofs (concrete read white from above)
road_material: /NVIDIA/Materials/Base/Natural/Asphalt.mdl
ground_material: /NVIDIA/Materials/Base/Natural/Grass_Cut.mdl
facades:                                   # window-grid textures generated per style (envbuild/osm.py)
  - {wall_rgb: [0.86, 0.84, 0.78], window_frac: [0.45, 0.45]}                           # 0 white / cream residential block
  - {wall_rgb: [0.62, 0.62, 0.60], window_frac: [0.55, 0.50]}                           # 1 grey concrete
  - {wall_rgb: [0.82, 0.70, 0.55], window_frac: [0.50, 0.45]}                           # 2 warm stucco
  - {wall_rgb: [0.28, 0.34, 0.40], glass_rgb: [0.10, 0.14, 0.20], window_frac: [0.88, 0.80], noise: 0.02}   # 3 glass curtain wall
  - {wall_rgb: [0.62, 0.38, 0.30], window_frac: [0.45, 0.45]}                           # 4 brick / terracotta
trees:
  assets: [/NVIDIA/Assets/Vegetation/Trees/American_Beech.usd, /NVIDIA/Assets/Vegetation/Plant_Tropical/Golden_Malay_Palm.usd,
           /NVIDIA/Assets/Vegetation/Plant_Tropical/Travelers_Palm.usd]
  weights: [5, 2, 1]
  asset_scale: [3.0, 1.0, 1.0]  # Black_Oak replaced: one species cost ~0.4 s/frame on the 4-camera rig (envbuild/bench.py)
  scale_range: [0.45, 0.75]                # rain trees / angsana at 8-13 m; palms smaller
  park_density_per_ha: 70
  street_spacing_m: 14
sky:
  hdr: /NVIDIA/Assets/Skies/Cloudy/kloofendal_48d_partly_cloudy_4k.hdr
  intensity: 900
  sun_intensity: 2800
  sun_elevation_deg: 62
  sun_azimuth_deg: 110
environment:
  first_warmup_updates: 400
  ground_z: 0.0
  stereo: {baseline_m: 0.30, pitch_deg: 20.0}
  openvins: {fi_max_dist: 200.0}
  lighting:
    default: {}
    overcast: {sky_hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr, sky_intensity: 1200}
  sky_dome: /World/Sky/Dome
  kit_args:
    - --/rtx/fog/enabled=true
    - --/rtx/fog/fogZup/enabled=true
    - --/rtx/fog/fogHeightDensity=0.0
    - --/rtx/fog/fogColor=[0.78,0.81,0.85]
    - --/rtx/fog/fogColorIntensity=1.0
    - --/rtx/fog/fogStartDist=400
    - --/rtx/fog/fogEndDist=4000
    - --/rtx/fog/fogDistanceDensity=0.5
