# Malaysian lowland rainforest (Taman Negara type): steep hills under a closed multi-layer canopy with
# emergent trees, a wide brown river in a flat-bottomed valley, palms, tree ferns, bamboo and banana in
# the understory, heavy humid haze. ~1.2 x 1.2 km.
name: my_rainforest
source: procedural
seed: 61
terrain:
  size_m: 1200
  resolution_m: 2.5
  hills_m: 40
  hill_scale_m: 300
  octaves: 5
  channels:
    - {angle_deg: 10, offset_m: 70, depth_m: 0, width_m: 45, flat_frac: 0.45, meander_m: 90,
       meander_wavelength_m: 520, floor_m: -9.0}
  material: /NVIDIA/Materials/vMaterials_2/Ground/Ground_Leaves.mdl
  uv_tile_m: 3.0
  layers:
    - {material: /NVIDIA/Materials/Base/Natural/Soil_Rocky.mdl, slope_range_deg: [32, 90]}
    - {material: /NVIDIA/Materials/vMaterials_2/Ground/Mulch.mdl#Mulch_Wet, height_range_m: [-99, -6.0]}   # river banks
water:
  level_m: -7.0
  size_m: 1200                      # river only: the land rises well above it outside the valley
  material: /NVIDIA/Materials/vMaterials_2/Liquids/Water_Murky_Perlinwaves.mdl
  uv_tile_m: 20.0
scatter:
  emergents:                        # dipterocarp-like emergents above the canopy
    class: tree
    assets: [/NVIDIA/Assets/Vegetation/Trees/Black_Oak.usd]
    density_per_ha: 10
    scale_range: [1.5, 2.0]
    height_range_m: [-6.0, 999]
    slope_max_deg: 40
    clear_radius_m: 20
    sink_m: 0.3
  canopy:
    class: tree
    assets: [/NVIDIA/Assets/Vegetation/Trees/Black_Oak.usd, /NVIDIA/Assets/Vegetation/Plant_Tropical/Cuban_Royal_Palm.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Golden_Malay_Palm.usd]
    weights: [6, 1, 2]
    density_per_ha: 150
    scale_range: [0.8, 1.3]
    height_range_m: [-6.0, 999]
    slope_max_deg: 45
    clear_radius_m: 20
    sink_m: 0.2
  understory:
    class: shrub
    assets: [/NVIDIA/Assets/Vegetation/Plant_Tropical/Australian_Tree_Fern.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Japanese_Fiber_Banana.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Buddha_Belly_Bamboo.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Travelers_Palm.usd]
    density_per_ha: 280
    scale_range: [1.0, 1.8]
    height_range_m: [-6.5, 999]
    obstacle: false
  river_palms:                      # nipa-like clumps on the banks
    class: shrub
    assets: [/NVIDIA/Assets/Vegetation/Plant_Tropical/Golden_Malay_Palm.usd]
    density_per_ha: 60
    scale_range: [1.6, 2.2]
    sink_m: 2.6
    height_range_m: [-7.3, -5.5]
    obstacle: false
sky:
  hdr: /NVIDIA/Assets/Skies/Cloudy/kloofendal_48d_partly_cloudy_4k.hdr
  intensity: 900
  sun_intensity: 2400
  sun_elevation_deg: 60
  sun_azimuth_deg: 120
environment:
  first_warmup_updates: 400
  ground_z: 0.0
  stereo: {baseline_m: 0.30, pitch_deg: 25.0}
  openvins: {fi_max_dist: 300.0}
  lighting:
    default: {}
    overcast: {sky_hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr, sky_intensity: 1200}
  sky_dome: /World/Sky/Dome
  kit_args:                         # humid haze, heavier than the swamp
    - --/rtx/fog/enabled=true
    - --/rtx/fog/fogZup/enabled=true
    - --/rtx/fog/fogHeightDensity=0.0
    - --/rtx/fog/fogColor=[0.80,0.83,0.86]
    - --/rtx/fog/fogColorIntensity=1.0
    - --/rtx/fog/fogStartDist=250
    - --/rtx/fog/fogEndDist=3000
    - --/rtx/fog/fogDistanceDensity=0.6
