forest_valley_v2:
  colliders: false
  settle_updates: 4
  warmup_updates: 30
  clip:
  - 0.1
  - 5000.0
  stereo:
    baseline_m: 0.3
    pitch_deg: 20.0
  openvins:
    fi_max_dist: 300.0
  lighting:
    default: {}
    overcast:
      sky_hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr
  first_warmup_updates: 400
  ground_z: 0.0
  sky_dome: /World/Sky/Dome
  kit_args:
  - --/rtx/fog/enabled=true
  - --/rtx/fog/fogZup/enabled=true
  - --/rtx/fog/fogHeightDensity=0.0
  - --/rtx/fog/fogColor=[0.74,0.79,0.85]
  - --/rtx/fog/fogColorIntensity=1.0
  - --/rtx/fog/fogStartDist=300
  - --/rtx/fog/fogEndDist=3500
  - --/rtx/fog/fogDistanceDensity=0.6
  usd: build/envs/forest_valley_v2/env.usda
