pegasus:                                 # Pegasus Simulator multirotor (third_party/pegasus, Isaac Sim 6.0 port)
  vehicle: Iris                          # pegasus.simulator.params.ROBOTS
  physics_hz: 1000                       # = f1_trajectory DENSE_HZ; the IMU is box-averaged down to imu.rate_hz
  preroll_s: 3.0                         # hover at the first waypoint before t = 0 so the spawn transient dies out
  drag: [0.50, 0.30, 0.0]                # linear body drag coefficients (Pegasus default)
  motor:                                 # first-order rotor lag (flights opt in with motor_lag: true)
    tau_up_s: 0.0125                     # = PX4's gazebo-classic Iris motor model (timeConstantUp), which the
    tau_down_s: 0.025                    # PX4 iris rate gains are tuned for; 35/60 ms put PX4 into a 2 Hz roll/yaw
                                         # limit cycle (+-3 deg). Slower motors need retuned MC_*RATE gains.
  wind_defaults:                         # merged under a flight's wind: block (pegasus_models.Wind)
    mean_mps: [0.0, 0.0, 0.0]            # ENU
    turbulence_sigma_mps: 0.0
    length_scale_m: 50.0                 # MIL-F-8785C low-altitude scale is ~h..300 m; 50 m suits < 50 m AGL
    seed: 3
  px4:                                   # controller: px4 flights (PX4 v1.16 SITL in Docker, px4/Dockerfile)
    image: isaac-exploration/px4:v1.16.0
    imu_hz: 250                          # Pegasus IMU/baro/mag -> PX4 HIL_SENSOR rate (lockstep)
    settle_s: 5.0                        # hold at the start point before the reference clock starts
    max_setup_s: 120.0                   # boot + GPS fix + takeoff budget (sim time)
    params:                              # set over MAVLink before arming
      COM_RCL_EXCEPT: 4                  # no RC-loss failsafe in offboard
      NAV_RCL_ACT: 0
      NAV_DLL_ACT: 0                     # no data-link-loss failsafe
      COM_RC_IN_MODE: 4                  # no RC at all
      COM_OF_LOSS_T: 2.0
      MPC_XY_VEL_MAX: 15.0               # let the reference's 12-13 m/s through
      MPC_XY_CRUISE: 12.0
  ardupilot:                             # controller: ardupilot flights (ArduCopter 4.6.3 SITL, ardupilot/Dockerfile)
    image: isaac-exploration/ardupilot:copter-4.6.3
    home: "38.736832,-9.137977,90,0"     # lat,lon,alt,heading; matches Pegasus' GPS origin
    base_params: [copter-single.parm, copter-coax.parm]   # ArduPilot's own SITL defaults, then the vehicle's file
    settle_s: 5.0
    params: {}                           # extra params over MAVLink (most live in the vehicle's .parm)
  vehicles:                              # flight key `vehicle:` (default: the Pegasus Iris above)
    coax_spirit:                         # coaxial helicopter sized like the Ascent AeroSystems Spirit
      # Public spec: 650 mm rotors, 257 mm x 106 mm core, 1.8 kg core, 6.1 kg MTOW, direct drive with
      # 2 brushless motors, ArduPilot on a Cube. Roll/pitch therefore come from cyclic (swashplate
      # servos) and yaw from the rotor speed difference. Everything below the spec line is an estimate.
      mass_kg: 4.0                       # core + one 12S battery + a camera module
      inertia_kgm2: [0.060, 0.060, 0.025]  # body x, y, z (tall cylinder + modules; z includes landing gear)
      rotor_radius_m: 0.325
      hub_height_m: 0.15                 # rotor plane above the centre of mass
      thrust_coeff: 3.4e-4               # T = k w^2 per rotor  (Ct ~0.008 at sea level)
      torque_coeff: 1.1e-5               # Q = c w^2 per rotor
      lower_rotor_efficiency: 0.85       # lower rotor works in the upper rotor's wake
      max_rotor_speed_rad_s: 420.0       # hover ~ 255 rad/s at 4 kg
      motor_tau_s: 0.08                  # 650 mm rotors spin up much slower than Iris props
      cyclic_max_deg: 10.0               # tip-path-plane tilt at full servo
      hub_stiffness_nm_per_rad: 8.0      # rigid-rotor flapping spring
      cyclic_tau_s: 0.03                 # servo + rotor flapping lag
      drag: [0.25, 0.25, 0.35]           # linear body drag (compact cylinder)
      px4_model: pegasus_coax            # px4/airframes/<id>_pegasus_coax (CA_AIRFRAME 12, coaxial helicopter)
      ardupilot_params: ardupilot/params/coax_spirit.parm   # FRAME_CLASS 9 (coax); swap in the real Spirit .param
  gains:                                 # Pegasus NonlinearController (Mellinger-style geometric tracking)
    Kp: [10.0, 10.0, 10.0]
    Kd: [8.5, 8.5, 8.5]
    Ki: [1.5, 1.5, 1.5]
    Kr: [3.5, 3.5, 3.5]
    Kw: [0.5, 0.5, 0.5]

imu:
  rate_hz: 200
  # Continuous-time noise densities and random walks (EuRoC ADIS16448-like); set enabled: false for clean IMU.
  enabled: true
  gyro_noise_density: 1.6968e-4          # rad/s/sqrt(Hz)
  gyro_random_walk: 1.9393e-5            # rad/s^2/sqrt(Hz)
  accel_noise_density: 2.0e-3            # m/s^2/sqrt(Hz)
  accel_random_walk: 3.0e-3              # m/s^3/sqrt(Hz)
  seed: 7
  vibration:                             # motor/frame vibration (remove this block for none); amplitudes at hover
    rotor_hz_hover: 120                  # shaft rate at hover; scales with sqrt(thrust)
    blades: 2                            # blade-pass tone at blades x shaft rate
    accel_amp_mps2: [0.8, 0.8, 1.5]      # per body axis (x fwd, y left, z up), all four rotors combined
    gyro_amp_rads: [0.03, 0.03, 0.015]
    broadband_accel_mps2: 0.4            # RMS frame noise, 30-400 Hz
    broadband_gyro_rads: 0.01

render:
  warmup_stride: 10                      # warm-up pass visits every Nth pose to fill Cesium's cache
  tile_timeout_s: 60.0                   # max wait per frame for tiles to finish loading
  max_screen_space_error: 8              # Cesium detail: lower = sharper tiles, slower streaming (Cesium default 16)
  sky_hdr: /NVIDIA/Assets/Skies/Cloudy/kloofendal_48d_partly_cloudy_4k.hdr   # under the Isaac assets root
  sky_intensity: 600                     # dome light lights the tiles and is the visible sky
  sun_intensity: 0                       # tiles have daylight and shadows baked in; a sun would double them
  settle_updates: 4                      # extra renderer updates after tiles are idle
  min_clearance_m: 5.0                   # depth closer than this flags a frame (Cesium has no colliders)

package:
  max_frames: 297                        # hosted Cosmos 3 480p limit
  depth_near_m: 5.0
  depth_far_m: 3000.0
  depth_convention: near_bright          # near_bright | near_dark (settled empirically in M2)
  canny: [60, 160]

cosmos:
  backend: nvidia_hosted                 # nvidia_hosted | vllm_omni | dry_run (local colour-grade stand-in for tests)
  endpoint: https://ai.api.nvidia.com/v1/cosmos/nvidia/cosmos3-nano
  resolution: "480_16_9"
  controls: [depth, edge]
  # Only documented request fields are sent; put anything else (e.g. guidance) in extra_fields
  # once confirmed against the live API reference.
  extra_fields: {}
  timeout_s: 900
  seeds: [1, 2]
  conditions:
    clear_noon: "Clear tropical midday, high sun, crisp hard shadows, saturated blue sky with a few cumulus clouds"
    overcast: "Thick uniform overcast, soft shadowless light, grey sky, muted colours"
    haze: "Heavy regional haze, reduced visibility, washed-out distant buildings, yellow-grey sky"
    tropical_rain: "Heavy tropical downpour, rain streaks, wet reflective surfaces, dark storm clouds, low contrast"
    dusk_low_sun: "Golden hour just before sunset, low sun from the west, long shadows, warm orange light, strong glare"
    night_city: "Night, city lights on, illuminated building facades and streets, dark sky, artificial lighting only"
    morning_mist: "Early morning, light mist over the water, soft pale light, low contrast, cool tones"

qa:
  edge_tolerance_px: 2
  edge_f_score_min: 0.30                 # output edges vs sim edges
  warp_error_ratio_max: 1.5              # reprojection photometric error, variant / original render
  track_reproj_excess_px_max: 0.75       # median KLT reprojection error vs GT poses, minus the sim render's
  track_length_ratio_min: 0.6            # mean track length, variant / original render
