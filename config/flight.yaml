# Drone flight through Cesium tiles -> Cosmos 3 appearance variations -> VIO dataset.
# Positions are local ENU metres around the Cesium georeference origin (X east, Y north, Z up).
# Thresholds under qa: are fixed before a batch, not tuned after.

flights:
  marina_bay_pass:
    site: marina_bay                     # pipeline/common/cesium_support.py SITES
    source: google                       # cesium/build_cesium_stage.py --source
    speed_mps: 10.0
    yaw_mode: velocity                   # velocity | look_at
    scene_description: >-
      Aerial view from a small drone flying over Marina Bay, Singapore: calm bay water, waterfront
      promenades, dense modern high-rise towers, the Marina Bay Sands hotel, trees and roads.
    package:                             # rendered depth spans ~85-600 m on this pass
      depth_near_m: 50.0
      depth_far_m: 2000.0
    waypoints:                          # over the bay, heading south-east towards Marina Bay Sands
      - [-330.0, 330.0, 100.0]
      - [-280.0, 285.0, 103.0]
      - [-235.0, 245.0, 106.0]
  marina_bay_loop: &marina_bay_loop      # ~105 s loop over the bay for VIO (OpenVINS), with hover for static init
    site: marina_bay
    source: google
    speed_mps: 10.0
    yaw_mode: velocity
    hover_start_s: 4.0
    hover_end_s: 3.0
    scene_description: >-
      Aerial view from a small drone circling over Marina Bay, Singapore: calm bay water, waterfront
      promenades, modern high-rise towers, the Marina Bay Sands hotel, trees and roads.
    package:
      depth_near_m: 50.0
      depth_far_m: 2000.0
    waypoints:                           # stays >= 150 m west of Marina Bay Sands (origin), 105-125 m up
      - [-330.0, 330.0, 110.0]
      - [-260.0, 400.0, 116.0]
      - [-330.0, 470.0, 124.0]
      - [-440.0, 440.0, 120.0]
      - [-470.0, 350.0, 113.0]
      - [-420.0, 260.0, 106.0]
      - [-320.0, 240.0, 111.0]
      - [-250.0, 300.0, 119.0]
      - [-300.0, 360.0, 115.0]
  marina_bay_loop_pegasus:               # same loop, flown by a simulated Iris quadrotor (flight/pegasus_fly.py)
    <<: *marina_bay_loop
    dynamics: pegasus                    # the spline is the controller's reference; poses + IMU come from physics
  # --- Rivermark (Isaac 6.0 outdoor town, docs/test_plans.md E1). z is absolute (ground ~0-5 m, roofs <= 17.5 m,
  # tallest objects ~28 m); x east, y north. Layout: build/envs/rivermark/topdown.png
  rm_p1_hover: &rm_base
    env: rivermark
    dynamics: pegasus
    profile: hover_yaw                   # hover in place, sinusoidal yaw sweep
    center: [40.0, -40.0, 25.0]          # over the main crossroads, mall to the north
    yaw0_deg: 60.0
    yaw_amplitude_deg: 90.0
    yaw_period_s: 18.0                   # peak yaw rate 31 deg/s
    sweep_s: 36.0
    hover_start_s: 4.0
    hover_end_s: 3.0
    speed_mps: 1.0                       # unused by hover_yaw
    yaw_mode: velocity
    scene_description: Drone hovering over a suburban crossroads next to a shopping centre.
    package: {depth_near_m: 2.0, depth_far_m: 500.0}
    waypoints: [[40.0, -40.0, 25.0], [40.0, -40.0, 25.0]]
  rm_p2_slow:                            # 25 m radius loop over the mall plaza, 2 m/s, >= 10 m over the 22 m roofs
    <<: *rm_base
    profile: spline
    speed_mps: 2.0
    waypoints: [[125.0, 200.0, 32.0], [117.7, 217.7, 32.5], [100.0, 225.0, 33.0], [82.3, 217.7, 33.5],
