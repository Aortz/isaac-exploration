# Military forward operating base, desert: double-height HESCO perimeter with a gate and a jersey-barrier
# chicane, corner guard towers, tent lines, a motor pool of armoured-vehicle proxies, a container yard,
# gravel inside the wire, sand and rock outside. ~800 x 800 m, compound 230 x 170 m. Props generated.
name: mil_fob_desert
source: procedural
seed: 91
terrain:
  size_m: 800
  resolution_m: 2.0
  hills_m: 4
  hill_scale_m: 300
  octaves: 4
  channels:                                   # gravel access road to the gate (south)
    - {angle_deg: 90, offset_m: 0, depth_m: 0.1, width_m: 5, meander_m: 15, meander_wavelength_m: 600}
  material: /NVIDIA/Materials/Base/Natural/Sand.mdl
  uv_tile_m: 3.0
  layers:
    - {material: /NVIDIA/Materials/vMaterials_2/Ground/Mulch.mdl, mask: compound}          # packed earth inside the wire
    - {material: /NVIDIA/Materials/Base/Natural/Dirt.mdl, mask: road}
masks:
  compound: {rect_m: [230, 170]}
  road: {channels: true, threshold: 0.35}
  tents_area: {rect_m: [90, 60], centre_m: [-50, 35]}
  motor_pool: {rect_m: [70, 50], centre_m: [55, 40]}
  containers_area: {rect_m: [60, 40], centre_m: [60, -45]}
scatter:
  hesco_perimeter:
    class: barrier
    generate: hesco
    variants: 2
    cells: 4
    height_scale: 2.0                         # 2.2 m double-height wall
    layout: perimeter
    rect_m: [220, 160]
    spacing_m: 4.4
    gate_m: 14
    scale_range: [1.0, 1.0]
  towers:
    class: structure
    generate: tower
    variants: 2
    layout: perimeter
    rect_m: [214, 154]
    spacing_m: 92
    scale_range: [1.0, 1.0]
  tents:
    class: structure
    generate: tent
    variants: 3
    layout: grid
    spacing_m: 13
    row_angle_deg: 0
    jitter_m: 0.3
    align: true
    mask: tents_area
    scale_range: [1.0, 1.0]
  vehicles:
    class: vehicle
    generate: vehicle_proxy
    variants: 6
    burned_frac: 0.0
    layout: grid
    spacing_m: 11
    row_angle_deg: 90
    jitter_m: 0.2
    align: true
    mask: motor_pool
    scale_range: [1.0, 1.0]
  containers:
    class: structure
    generate: container
    variants: 6
    layout: grid
    spacing_m: 8
    row_angle_deg: 0
    jitter_m: 0.1
    align: true
    mask: containers_area
    scale_range: [1.0, 1.0]
  jersey_barriers:
    class: barrier
    generate: jersey_barrier
    variants: 1
    layout: perimeter
    rect_m: [40, 30]
    centre_m: [0, -110]                       # chicane outside the gate
    spacing_m: 3.2
    gate_m: 8
    scale_range: [1.0, 1.0]
    obstacle: false
  sandbags:
    class: barrier
    generate: sandbags
    variants: 2
    density_per_ha: 4
    mask: compound
    scale_range: [1.0, 1.0]
    clear_radius_m: 20
    obstacle: false
  scrub:
    class: shrub
    assets: [/NVIDIA/Assets/Vegetation/Plant_Tropical/Agave.usd, /NVIDIA/Assets/Vegetation/Shrub/Acacia.usd]
    density_per_ha: 3
    mask: "!compound"
    obstacle: false
sky:
  hdr: /NVIDIA/Assets/Skies/Clear/noon_grass_4k.hdr
  intensity: 500
  sun_intensity: 1500
  sun_elevation_deg: 40
  sun_azimuth_deg: 150
environment:
  first_warmup_updates: 400
  ground_z: 0.0
  stereo: {baseline_m: 0.30, pitch_deg: 25.0}
  openvins: {fi_max_dist: 250.0}
  lighting:
    default: {}
    low_sun: {sky_hdr: /NVIDIA/Assets/Skies/Clear/venice_sunset_4k.hdr}
  sky_dome: /World/Sky/Dome
  kit_args:                                   # dust haze; also hides the HDR's green horizon
    - --/rtx/fog/enabled=true
    - --/rtx/fog/fogZup/enabled=true
    - --/rtx/fog/fogHeightDensity=0.0
    - --/rtx/fog/fogColor=[0.85,0.80,0.70]
    - --/rtx/fog/fogColorIntensity=1.0
    - --/rtx/fog/fogStartDist=250
    - --/rtx/fog/fogEndDist=2500
    - --/rtx/fog/fogDistanceDensity=0.75
