    colliders: false                     # splats have no colliders; clearance comes from occupancy_map.png
    kit_args: ["--/UJITSO/geometry=true", "--/renderer/multiGpu/enabled=false", "--/app/useFabricSceneDelegate=true"]   # ParticleField splats render black with Isaac's default (false)
    settle_updates: 4
    warmup_updates: 10
    clip: [0.05, 200.0]
    stereo: {baseline_m: 0.12, pitch_deg: 0.0}
