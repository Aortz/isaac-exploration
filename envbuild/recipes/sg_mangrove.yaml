# Singapore-style mangrove swamp (Sungei Buloh / Kranji type): tidal mud flats a few decimetres above
# murky water, meandering creeks draining north into open water (Johor Strait), closed mangrove canopy
# on the flats, nipa-like palms on the creek banks and back-mangrove / secondary forest on the higher
# ground. Mangroves are generated (prop roots + broadleaf crown): no mangrove asset ships with Isaac.
# ~1 x 1 km of land, water to the horizon on the north side.
name: sg_mangrove
source: procedural
seed: 37
terrain:
  size_m: 1000
  resolution_m: 2.0
  hills_m: 3.0                    # hummocks and flats around the water level
  hill_scale_m: 180
  octaves: 5
  channels:                       # tidal creeks running north into the strait
    - {angle_deg: 90, offset_m: 140, depth_m: 3.0, width_m: 14, meander_m: 45, meander_wavelength_m: 320}
    - {angle_deg: 95, offset_m: -170, depth_m: 2.5, width_m: 10, meander_m: 35, meander_wavelength_m: 260, phase_deg: 70}
    - {angle_deg: 20, offset_m: 260, depth_m: 1.8, width_m: 7, meander_m: 25, meander_wavelength_m: 180}
  shore: {direction_deg: 90, at_m: 330, width_m: 50, drop_m: 5.0}
  material: /NVIDIA/Materials/vMaterials_2/Ground/Mulch.mdl#Mulch_Wet  # tidal mud with root litter
  uv_tile_m: 3.0
  layer_noise: {scale_m: 10, mask_jitter: 0.6, height_jitter_m: 0.25, slope_jitter_deg: 4}   # irregular material edges
  layers:
    - {material: /NVIDIA/Materials/vMaterials_2/Ground/Ground_Leaves.mdl, height_range_m: [0.7, 99]}     # leaf litter above the tide
    - {material: /NVIDIA/Materials/Base/Natural/Grass_Countryside.mdl, height_range_m: [1.6, 99], mask: "!canopy"}
water:
  level_m: 0.15                   # high tide: the flats flood among the mangrove roots
  size_m: 8000                    # to the horizon
  material: /NVIDIA/Materials/vMaterials_2/Liquids/Water_Murky_Perlinwaves.mdl
  uv_tile_m: 20.0
masks:
  canopy: {scale_m: 160, cover: 0.85}
detail:                                       # level of detail around the flight path (lod: groups)
  corridor: sg_p3_loop
  near_m: 150
  far_m: 500
  far_density: 0.4
scatter:
  mangroves:
    clumping: {scale_m: 60, strength: 0.8}     # stands and gaps, same mean density
    tilt_deg: 3
    lod: thin
    class: tree
    generate: mangrove
    crowns:
      - {asset: /NVIDIA/Assets/Vegetation/Trees/Orange_Tree.usd, scale: [2.3, 3.3], hide: [fruit]}   # dense, dark glossy: Rhizophora-like, 8-11 m
      - {asset: /NVIDIA/Assets/Vegetation/Trees/Orange_Tree.usd, scale: [2.3, 3.3], hide: [fruit]}
      - {asset: /NVIDIA/Assets/Vegetation/Trees/American_Beech.usd, scale: [1.2, 1.65]}             # darker, open: Avicennia-like, 7-10 m (Black_Oak cost ~0.4 s/frame)
    variants: 6
    hub_height_m: [1.0, 1.8]
    root_spread_m: [1.6, 3.0]
    roots: [14, 22]
    density_per_ha: 120
    scale_range: [0.85, 1.25]
    height_range_m: [-0.8, 1.2]     # stand in up to ~1 m of water at high tide
    mask: canopy
    clear_radius_m: 18              # take-off clearing at the origin
    sink_m: 0.1
  nipa:                            # Nypa-like stemless palms on the creek banks: Golden Malay palm, trunk buried
    lod: near_only                            # only near the flight path: too small to resolve further out
    class: shrub
    assets: [/NVIDIA/Assets/Vegetation/Plant_Tropical/Golden_Malay_Palm.usd]
    density_per_ha: 70
    scale_range: [1.6, 2.2]
    sink_m: 2.6
    height_range_m: [-0.4, 0.5]
    clear_radius_m: 18
    obstacle: false
  back_forest:                     # back mangrove / secondary forest on the higher ground
    asset_scale: [3.0, 1.0, 1.0, 1.0]  # Black_Oak replaced: one species cost ~0.4 s/frame on the 4-camera rig (envbuild/bench.py)
    clumping: {scale_m: 60, strength: 0.8}     # stands and gaps, same mean density
    tilt_deg: 3
    lod: thin
    class: tree
    assets: [/NVIDIA/Assets/Vegetation/Trees/American_Beech.usd, /NVIDIA/Assets/Vegetation/Plant_Tropical/Cuban_Royal_Palm.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Golden_Malay_Palm.usd, /NVIDIA/Assets/Vegetation/Plant_Tropical/Travelers_Palm.usd]
    weights: [6, 2, 2, 1]
    density_per_ha: 70
    scale_range: [0.7, 1.1]
    height_range_m: [1.2, 99]
    clear_radius_m: 18
    sink_m: 0.2
  understory:
    lod: near_only                            # only near the flight path: too small to resolve further out
    class: shrub
    assets: [/NVIDIA/Assets/Vegetation/Plant_Tropical/Australian_Tree_Fern.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Japanese_Fiber_Banana.usd,
             /NVIDIA/Assets/Vegetation/Plant_Tropical/Buddha_Belly_Bamboo.usd, /NVIDIA/Assets/Vegetation/Shrub/Hibiscus.usd]
    density_per_ha: 150
    scale_range: [0.9, 1.6]
    height_range_m: [0.9, 99]
    clear_radius_m: 18
    obstacle: false
  pneumatophores:                  # breathing-root spike patches on the mud near the water line
    class: debris
    generate: pneumatophores
    variants: 4
    density_per_ha: 60
    height_range_m: [0.0, 0.6]
    scale_range: [0.8, 1.4]
    lod: near_only
    obstacle: false
  driftwood:
    class: debris
    generate: log
    variants: 4
    length_m: [2, 6]
    radius_m: [0.08, 0.2]
    rgb: [0.42, 0.38, 0.32]
    density_per_ha: 6
    height_range_m: [-0.2, 0.8]
    lod: near_only
    obstacle: false
sky:
  hdr: /NVIDIA/Assets/Skies/Cloudy/kloofendal_48d_partly_cloudy_4k.hdr
  intensity: 900
  sun_intensity: 2800
  sun_elevation_deg: 62           # near-equatorial late morning
  sun_azimuth_deg: 110
environment:
  first_warmup_updates: 400       # once, before the first frame: MDL compile + texture streaming (ground renders white until then)
  ground_z: 0.0
  stereo: {baseline_m: 0.30, pitch_deg: 25.0}
  openvins: {fi_max_dist: 300.0}
  lighting:
    default: {}
    overcast: {sky_hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr, sky_intensity: 1200}
  sky_dome: /World/Sky/Dome
  kit_args:                       # humid tropical haze: distance fog hides the terrain edge
    - --/rtx/fog/enabled=true
    - --/rtx/fog/fogZup/enabled=true          # default height axis is +Y: a wall of fog across y = 0
    - --/rtx/fog/fogHeightDensity=0.0          # distance haze only
    - --/rtx/fog/fogColor=[0.78,0.81,0.85]
    - --/rtx/fog/fogColorIntensity=1.0
    - --/rtx/fog/fogStartDist=400
    - --/rtx/fog/fogEndDist=4000
    - --/rtx/fog/fogDistanceDensity=0.5
