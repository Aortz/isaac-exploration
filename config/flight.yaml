  rm_p6_close:                           # below roof level between townhouse rows, >= 5.4 m clearance (corridor search on probe boxes), 2 m/s
    <<: *rm_base
    profile: spline
    speed_mps: 2.0
    waypoints: [[148.0, -198.5, 14.0], [185.5, -178.5, 14.0], [223.1, -158.6, 14.0]]   # 8 m AGL, roofs 17.5 m
  rm_p3_px4:                             # P3 loop flown by PX4 (EKF2 + offboard), motor lag, 4 m/s wind + turbulence + gusts
    <<: *rm_base
    profile: spline
    speed_mps: 6.0
    controller: px4
    motor_lag: true
    wind:
      mean_mps: [3.0, 2.5, 0.0]          # ~4 m/s from the south-west
