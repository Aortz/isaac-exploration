# Battleground: open farmland front line. Zig-zag trench lines, a dense shell-crater field, sandbag
# positions, destroyed vehicles, shattered treelines of charred dead trees, muddy ground. ~900 x 900 m.
name: bg_trench_field
source: procedural
seed: 82
terrain:
  size_m: 900
  resolution_m: 1.0
  hills_m: 6.0
  hill_scale_m: 350
  octaves: 4
  craters: {count: 600, radius_m: [1.5, 6.0], depth_ratio: 0.3, rim_ratio: 0.12, seed: 9, clear_radius_m: 25}
  channels:                                   # trenches: narrow, steep, zig-zag (short meander wavelength)
    - {angle_deg: 0, offset_m: 90, depth_m: 2.0, width_m: 1.4, flat_frac: 0.5, meander_m: 6, meander_wavelength_m: 24}
    - {angle_deg: 3, offset_m: 130, depth_m: 2.0, width_m: 1.4, flat_frac: 0.5, meander_m: 6, meander_wavelength_m: 28, phase_deg: 90}
    - {angle_deg: -4, offset_m: -150, depth_m: 2.0, width_m: 1.4, flat_frac: 0.5, meander_m: 6, meander_wavelength_m: 26}
    - {angle_deg: 90, offset_m: 40, depth_m: 1.8, width_m: 1.2, flat_frac: 0.5, meander_m: 4, meander_wavelength_m: 20}
  material: /NVIDIA/Materials/vMaterials_2/Ground/Mulch.mdl#Mulch_Wet   # churned mud
  uv_tile_m: 3.0
  layers:
    - {material: /NVIDIA/Materials/Base/Natural/Grass_Winter.mdl, mask: field}
    - {material: /NVIDIA/Materials/vMaterials_2/Ground/Mulch.mdl#Mulch_Wet, mask: crater}
    - {material: /NVIDIA/Materials/vMaterials_2/Ground/Mulch.mdl#Mulch_Wet, mask: trench}
masks:
  field: {scale_m: 200, cover: 0.45}
  crater: {craters: true, threshold: 0.05}
  trench: {channels: true, threshold: 0.2}
  treeline: {scale_m: 60, cover: 0.12}
scatter:
  dead_trees:
    class: tree
    generate: dead_tree
    variants: 8
    height_m: [6, 14]
    density_per_ha: 90
    scale_range: [0.8, 1.3]
    mask: treeline
    clear_radius_m: 25
  sandbags:
    class: barrier
    generate: sandbags
    variants: 4
    length_m: 4.0
    rows: 4
    density_per_ha: 3
    scale_range: [1.0, 1.0]
    clear_radius_m: 15
    obstacle: false
  vehicles:
    class: vehicle
    generate: vehicle_proxy
    variants: 6
    burned_frac: 0.8
    density_per_ha: 0.6
    scale_range: [1.0, 1.0]
    clear_radius_m: 25
  rubble:
    class: rubble
    generate: rubble
    variants: 4
    density_per_ha: 2
    scale_range: [0.6, 1.2]
    obstacle: false
sky:
  hdr: /NVIDIA/Assets/Skies/Cloudy/abandoned_parking_4k.hdr
  intensity: 1000
  sun_intensity: 1400
  sun_elevation_deg: 30
  sun_azimuth_deg: 200
environment:
  first_warmup_updates: 400
  ground_z: 0.0
  stereo: {baseline_m: 0.30, pitch_deg: 25.0}
  openvins: {fi_max_dist: 250.0}
  lighting:
    default: {}
    low_sun: {sky_hdr: /NVIDIA/Assets/Skies/Clear/venice_sunset_4k.hdr}
  sky_dome: /World/Sky/Dome
  kit_args:
    - --/rtx/fog/enabled=true
    - --/rtx/fog/fogZup/enabled=true
    - --/rtx/fog/fogHeightDensity=0.0
    - --/rtx/fog/fogColor=[0.72,0.72,0.72]
    - --/rtx/fog/fogColorIntensity=1.0
    - --/rtx/fog/fogStartDist=300
    - --/rtx/fog/fogEndDist=3500
    - --/rtx/fog/fogDistanceDensity=0.6
